pre-commit:
  jobs:
    - name: "[Biome] Run Format"
      run: pnpm format

    - name: "[Biome] Run Lint"
      run: pnpm lint

# Runs only after pre-commit passes. feat/abc -> "feat(abc): msg", dev -> "dev: msg"
commit-msg:
  jobs:
    - name: "[Git] Prefix commit message with branch"
      run: |
        branch=$(git symbolic-ref --short HEAD 2>/dev/null) || exit 0
        case "$branch" in
          */*) prefix="${branch%%/*}(${branch#*/})" ;;
          *)   prefix="$branch" ;;
        esac
        first=$(grep -v '^#' {1} | grep -m1 .)
        case "$first" in
          "$prefix:"*|"Merge "*|"Revert "*|"fixup! "*|"squash! "*|"amend! "*) exit 0 ;;
        esac
        awk -v p="$prefix: " '!done && !/^#/ && NF { $0 = p $0; done = 1 } 1' {1} > {1}.tmp && mv {1}.tmp {1}
